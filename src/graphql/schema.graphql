enum TenantType {
  MAIN
  SUB
}

enum TenantStatus {
  ACTIVE
  SUSPENDED
}

enum TenantDomainPurpose {
  MANAGEMENT
  WEBSITE
}

enum TenantDomainStatus {
  PENDING_VERIFICATION
  PENDING_DNS
  ACTIVE
  ERROR
  DISABLED
}

enum UserStatus {
  PENDING
  ACTIVE
  LOCKED
  INACTIVE
}

enum MembershipStatus {
  ACTIVE
  DISABLED
}

enum ActivationStatus {
  PENDING
  EXPIRED
  ACTIVE
  DISABLED
}

enum UserType {
  MAIN
  SUB
}

enum SubTenantRole {
  ADMIN
  EDITOR
}

enum TenantUserPermission {
  USERS_VIEW
  USERS_CREATE
  USERS_EDIT
  USERS_CHANGE_ROLE
  USERS_ACTIVATE
  USERS_SUSPEND
  USERS_RESET_PASSWORD
  USERS_DELETE
  BRANDING_VIEW
  BRANDING_UPDATE
  CATEGORY_VIEW
  CATEGORY_VIEW_SUBCATEGORY
  CATEGORY_CREATE
  CATEGORY_CREATE_SUBCATEGORY
  CATEGORY_EDIT
  CATEGORY_EDIT_SUBCATEGORY
  CATEGORY_DELETE
  CATEGORY_DELETE_SUBCATEGORY
  TAG_VIEW
  TAG_CREATE
  TAG_EDIT
  TAG_DELETE
  ARTICLE_VIEW
  ARTICLE_CREATE
  ARTICLE_UPDATE_OWN
  ARTICLE_UPDATE_ANY
  ARTICLE_DELETE_OWN
  ARTICLE_DELETE_ANY
  ARTICLE_DELETE_ARCHIVED
  ARTICLE_SUBMIT
  ARTICLE_REVIEW
  ARTICLE_PUBLISH
  ARTICLE_UNPUBLISH
  ARTICLE_SCHEDULE
  ARTICLE_ARCHIVE
  ARTICLE_RESTORE
  ARTICLE_SET_BREAKING
  ARTICLE_SET_FEATURED
}

input TranslationInput { locale: String!, name: String! }
input CreateCategoryInput { slug: String!, translations: [TranslationInput!] }
input UpdateCategoryInput { slug: String, translations: [TranslationInput!] }
input CreateSubcategoryInput { categoryId: ID!, slug: String!, translations: [TranslationInput!] }
input UpdateSubcategoryInput { slug: String, translations: [TranslationInput!] }

type CategoryTranslation { locale: String!, name: String! }
type SubcategoryTranslation { locale: String!, name: String! }
type TagTranslation { locale: String!, name: String! }
type Tag { id: ID!, name: String!, slug: String!, translations: [TagTranslation!]!, createdAt: String!, updatedAt: String! }
input CreateTagInput { name: String!, slug: String!, translations: [TranslationInput!] }
input UpdateTagInput { name: String, slug: String, translations: [TranslationInput!] }
type Category { id: ID!, slug: String!, name: String!, translations: [CategoryTranslation!]!, subcategories: [Subcategory!]!, createdAt: String!, updatedAt: String! }
type Subcategory { id: ID!, categoryId: ID!, slug: String!, translations: [SubcategoryTranslation!]!, createdAt: String!, updatedAt: String! }

enum ArticleStatus { DRAFT IN_REVIEW SCHEDULED PUBLISHED ARCHIVED }
enum ArticleScope { ALL MY REVIEW }
enum ArticleReviewDecision { SUBMITTED CHANGES_REQUESTED APPROVED }
type ArticleSummary {
  id: ID!
  title: String!
  slug: String!
  status: ArticleStatus!
  categoryId: ID!
  categoryName: String!
  authorId: ID
  authorName: String
  isBreaking: Boolean!
  isFeatured: Boolean!
  featuredImageUrl: String
  scheduledAt: String
  updatedAt: String!
}
type ArticlePage { items: [ArticleSummary!]!, total: Int!, page: Int!, pageSize: Int! }
type PublicWebsiteCategory { id: ID!, slug: String!, name: String!, translations: [CategoryTranslation!]! }
type PublicWebsiteSubcategory { slug: String!, translations: [SubcategoryTranslation!]! }
type PublicWebsiteNavigationCategory { id: ID!, slug: String!, name: String!, translations: [CategoryTranslation!]!, subcategories: [PublicWebsiteSubcategory!]! }
type PublicWebsiteTag { slug: String!, name: String!, translations: [TagTranslation!]! }
type PublicWebsiteArticleLocale { locale: String!, title: String!, summary: String }
type PublicWebsiteArticleSummary {
  id: ID!
  title: String!
  slug: String!
  summary: String
  category: PublicWebsiteCategory!
  subcategorySlug: String!
  isBreaking: Boolean!
  isFeatured: Boolean!
  featuredImageUrl: String
  publishedAt: String!
  translations: [PublicWebsiteArticleLocale!]!
}
type PublicWebsiteArticle {
  id: ID!
  title: String!
  slug: String!
  summary: String
  content: String!
  category: PublicWebsiteCategory!
  subcategorySlug: String!
  isBreaking: Boolean!
  isFeatured: Boolean!
  featuredImageUrl: String
  publishedAt: String!
  authorName: String
  translations: [ArticleTranslation!]!
  tags: [PublicWebsiteTag!]!
}
type PublicWebsiteArticlePage { items: [PublicWebsiteArticleSummary!]!, total: Int!, page: Int!, pageSize: Int! }
type ArticleTag { id: ID!, name: String! }
type ArticleTranslation { locale: String!, title: String!, summary: String, content: String! }
type ArticleReview { id: ID!, decision: ArticleReviewDecision!, comment: String, reviewerName: String, createdAt: String! }
type Article {
  id: ID!
  title: String!
  slug: String!
  summary: String
  content: String!
  status: ArticleStatus!
  categoryId: ID!
  categoryName: String!
  subcategoryId: ID!
  subcategoryName: String!
  authorId: ID
  authorName: String
  publishedById: ID
  isBreaking: Boolean!
  isFeatured: Boolean!
  featuredImageUrl: String
  scheduledAt: String
  publishedAt: String
  archivedAt: String
  createdAt: String!
  updatedAt: String!
  tags: [ArticleTag!]!
  translations: [ArticleTranslation!]!
  reviews: [ArticleReview!]!
}
input ArticleTranslationInput { locale: String!, title: String!, summary: String, content: String! }
input CreateArticleInput {
  title: String!, slug: String!, summary: String, content: String!,
  categoryId: ID!, subcategoryId: ID!, tagIds: [ID!],
  translations: [ArticleTranslationInput!], featuredImageUrl: String
}
input UpdateArticleInput {
  title: String, slug: String, summary: String, content: String,
  categoryId: ID, subcategoryId: ID, tagIds: [ID!],
  translations: [ArticleTranslationInput!], featuredImageUrl: String
}

enum BrandingAsset {
  MANAGEMENT_LOGO
  WEBSITE_LOGO
  FAVICON
  PUBLIC_WEBSITE_FAVICON
  OPEN_GRAPH_IMAGE
}

enum UserManagementRole {
  SUPERADMIN
  ADMIN
  EDITOR
}

enum LoginAudience {
  ADMIN_CONSOLE
  TENANT_APP
}

enum AuthNextStep {
  TOTP_ENROLL
  TOTP_VERIFY
}

type Tenant {
  id: ID!
  name: String!
  slug: String!
  type: TenantType!
  status: TenantStatus!
  createdAt: String!
  managementDomain: String
  websiteDomain: String
  managementDomainStatus: TenantDomainStatus
  websiteDomainStatus: TenantDomainStatus
  managementDomainVerifiedAt: String
  websiteDomainVerifiedAt: String
  localDevelopmentHostname: String
  userCount: Int
}

type TenantBranding {
  tenantId: ID!
  managementLogoUrl: String
  websiteLogoUrl: String
  faviconUrl: String
  publicWebsiteFaviconUrl: String
  openGraphImageUrl: String
}

type TenantDomainVerification {
  purpose: TenantDomainPurpose!
  hostname: String!
  status: TenantDomainStatus!
  verifiedAt: String
  recordName: String
  recordValue: String
}

type TenantDomainResolution {
  id: ID!
  name: String!
  slug: String!
  type: TenantType!
  status: TenantStatus!
  managementDomain: String
  websiteDomain: String
  managementLogoUrl: String
  websiteLogoUrl: String
  faviconUrl: String
  publicWebsiteFaviconUrl: String
  openGraphImageUrl: String
}

type PublicTenantBranding {
  id: ID!
  name: String!
  slug: String!
  managementLogoUrl: String
  websiteLogoUrl: String
  faviconUrl: String
  publicWebsiteFaviconUrl: String
  openGraphImageUrl: String
}

input UpdateSubTenantInput {
  name: String!
  slug: String!
  managementDomain: String
  websiteDomain: String
  localDevelopmentHostname: String
}

type User {
  id: ID!
  email: String!
  username: String
  fullName: String!
  firstName: String
  lastName: String
  type: UserType!
  role: String!
  status: UserStatus
  membershipStatus: MembershipStatus
  tenantId: ID!
  tenant: Tenant!
  createdAt: String
  lastLoginAt: String
  totpEnabled: Boolean
}

type MainTenantUserPage {
  items: [User!]!
  total: Int!
  page: Int!
  pageSize: Int!
}

type TenantUserPage {
  items: [User!]!
  total: Int!
  page: Int!
  pageSize: Int!
}

type ManagedSubTenantUser {
  id: ID!
  fullName: String!
  firstName: String
  lastName: String
  username: String
  email: String!
  role: String!
  accountStatus: UserStatus!
  membershipStatus: MembershipStatus!
  activationStatus: ActivationStatus!
  activationLinkCreatedAt: String
  activationLinkExpiresAt: String
}

type ManagedSubTenantUserPage {
  items: [ManagedSubTenantUser!]!
  total: Int!
  page: Int!
  pageSize: Int!
}

type TenantActivationLinkPayload {
  activationUrl: String!
  expiresAt: String!
}

type CreateMainTenantUserPayload {
  user: User!
  activationUrl: String!
  expiresAt: String!
}

type CreateTenantUserPayload {
  user: User!
  activationUrl: String!
  expiresAt: String!
}

type ActivationLinkPayload {
  activationUrl: String!
  expiresAt: String!
  user: User!
}

type ExistingActivationLinkPayload {
  activationUrl: String!
  expiresAt: String!
}

type ExistingPasswordResetLinkPayload {
  resetUrl: String!
  expiresAt: String!
}

input UpdateMainTenantUserInput {
  firstName: String
  lastName: String
  email: String
  status: UserStatus
  suspended: Boolean
}

input UpdateTenantUserInput {
  email: String
  firstName: String
  lastName: String
  role: SubTenantRole
  status: UserStatus
  suspended: Boolean
}

input UpdateTenantRolePermissionsInput {
  role: UserManagementRole!
  permissions: [TenantUserPermission!]!
}

type TenantRolePermissions {
  role: UserManagementRole!
  permissions: [TenantUserPermission!]!
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  audience: LoginAudience!
  user: User!
}

type AuthChallenge {
  challengeToken: String!
  nextStep: AuthNextStep!
  qrCodeDataUrl: String
  manualEntryKey: String
}

union LoginResult = AuthPayload | AuthChallenge

type PasswordResetLinkPayload {
  resetUrl: String!
  expiresAt: String!
  user: User!
}

type MonthCount {
  month: String!
  count: Int!
}

type StatusCount {
  status: String!
  count: Int!
}

type ActivityItem {
  id: ID!
  action: String!
  createdAt: String!
  actorEmail: String
  targetTenantName: String
  targetTenantSlug: String
}

type AuditLogItem {
  id: ID!
  action: String!
  success: Boolean!
  createdAt: String!
  actorEmail: String
  targetTenantName: String
  targetType: String
  targetId: ID
  details: String
}

type AuditLogPage {
  items: [AuditLogItem!]!
  total: Int!
  page: Int!
  pageSize: Int!
}

type PlatformDashboard {
  totalSubTenants: Int!
  activeSubTenants: Int!
  totalAdmins: Int!
  platformHealth: String!
  growthByMonth: [MonthCount!]!
  statusDistribution: [StatusCount!]!
  recentSubTenants: [Tenant!]!
  recentActivity: [ActivityItem!]!
}

type TenantDashboard {
  tenant: Tenant!
  totalUsers: Int!
  activeUsers: Int!
  publishedContent: Int!
  mediaStorageBytes: Int!
  contentActivityByMonth: [MonthCount!]!
  contentByStatus: [StatusCount!]!
  recentUsers: [User!]!
  recentActivity: [ActivityItem!]!
}

type SubTenantPage {
  items: [Tenant!]!
  total: Int!
  page: Int!
  pageSize: Int!
}

type ActivationValidatePayload {
  valid: Boolean!
  expiresAt: String!
  email: String!
  firstName: String
  lastName: String
  needsActivation: Boolean!
}

type ActivationCredentialsPayload {
  nextStep: AuthNextStep!
  challengeToken: String!
  qrCodeDataUrl: String
  manualEntryKey: String
  email: String!
  username: String!
}

type ActivationCompletePayload {
  success: Boolean!
  recoveryCodes: [String!]!
  user: User!
}

type PasswordResetValidatePayload {
  valid: Boolean!
  expiresAt: String!
  username: String!
}

type PasswordResetCompletePayload {
  success: Boolean!
}

type RefreshSessionPayload {
  accessToken: String!
  refreshToken: String!
  audience: LoginAudience!
  user: User!
}

type Query {
  tenantBranding(tenantId: ID!): TenantBranding!
  myTenantBranding: TenantBranding!
  mainTenantBranding: TenantBranding!
  publicMainTenantBranding: TenantBranding!
  tenantRolePermissions: [TenantRolePermissions!]!
  tenantRolePermissionSummary: [TenantRolePermissions!]!
  tenantUserPermissions: [TenantUserPermission!]!
  mainTenantUserActivationLink(userId: ID!): ExistingActivationLinkPayload
  subTenantUserActivationLink(tenantId: ID!, userId: ID!): ExistingActivationLinkPayload
  tenantUserActivationLink(userId: ID!): ExistingActivationLinkPayload
  mainTenantUserPasswordResetLink(userId: ID!): ExistingPasswordResetLinkPayload
  subTenantUserPasswordResetLink(tenantId: ID!, userId: ID!): ExistingPasswordResetLinkPayload
  tenantUserPasswordResetLink(userId: ID!): ExistingPasswordResetLinkPayload
  me: User
  platformDashboard: PlatformDashboard!
  tenantDashboard: TenantDashboard!
  platformAuditLogs(page: Int): AuditLogPage!
  tenantAuditLogs(page: Int): AuditLogPage!
  categories(search: String): [Category!]!
  category(id: ID!): Category
  subcategories(categoryId: ID, search: String): [Subcategory!]!
  subcategory(id: ID!): Subcategory
  tags(search: String, page: Int = 1, pageSize: Int = 25): [Tag!]!
  tag(id: ID!): Tag
  articles(search: String, status: ArticleStatus, categoryId: ID, scope: ArticleScope, page: Int, pageSize: Int): ArticlePage!
  article(id: ID!): Article
  publicWebsiteCategories(tenantId: ID!): [PublicWebsiteNavigationCategory!]!
  publicWebsiteTags(tenantId: ID!): [PublicWebsiteTag!]!
  publicWebsiteArticles(tenantId: ID!, categorySlug: String, subcategorySlug: String, tagSlug: String, search: String, featured: Boolean, breaking: Boolean, page: Int = 1, pageSize: Int = 12): PublicWebsiteArticlePage!
  publicWebsiteArticle(tenantId: ID!, slug: String!): PublicWebsiteArticle
  subTenants(search: String, page: Int, pageSize: Int): SubTenantPage!
  subTenant(id: ID!): Tenant!
  tenantByHostname(
    hostname: String!
    purpose: TenantDomainPurpose!
  ): TenantDomainResolution
  tenantById(id: ID!): PublicTenantBranding
  tenantBySlug(slug: String!): PublicTenantBranding
  localDevelopmentTenant: PublicTenantBranding
  mainTenantUsers(search: String, page: Int, pageSize: Int): MainTenantUserPage!
  mainTenantUser(id: ID!): User!
  tenantUsers(search: String, page: Int, pageSize: Int): TenantUserPage!
  subTenantUsers(tenantId: ID!, search: String, page: Int, pageSize: Int): ManagedSubTenantUserPage!
  validateActivationToken(token: String!): ActivationValidatePayload!
  validatePasswordResetToken(token: String!): PasswordResetValidatePayload!
}

type Mutation {
  updateTenantBranding(tenantId: ID!, asset: BrandingAsset!, fileName: String!, mimeType: String!, contentBase64: String): TenantBranding!
  updateMyTenantBranding(asset: BrandingAsset!, fileName: String!, mimeType: String!, contentBase64: String): TenantBranding!
  updateMainTenantBranding(asset: BrandingAsset!, fileName: String!, mimeType: String!, contentBase64: String): TenantBranding!
  updateTenantRolePermissions(input: UpdateTenantRolePermissionsInput!): TenantRolePermissions!
  login(
    email: String!
    password: String!
    audience: LoginAudience = ADMIN_CONSOLE
    tenantHostname: String
  ): LoginResult!
  verifyLoginTotp(challengeToken: String!, code: String!): AuthPayload!
  verifyTotpEnrollment(challengeToken: String!, code: String!): AuthPayload!
  verifyRecoveryCode(challengeToken: String!, code: String!): AuthPayload!
  refreshSession(
    refreshToken: String!
    audience: LoginAudience!
  ): RefreshSessionPayload!
  completeActivation(
    token: String!
    username: String!
    password: String!
    confirmPassword: String!
  ): ActivationCredentialsPayload!
  completeActivationTotp(
    challengeToken: String!
    code: String!
  ): ActivationCompletePayload!
  completePasswordReset(
    token: String!
    password: String!
    confirmPassword: String!
  ): PasswordResetCompletePayload!
  generatePasswordResetLink(userId: ID!): PasswordResetLinkPayload!
  generateMainTenantUserPasswordResetLink(userId: ID!): PasswordResetLinkPayload!
  generateMainTenantUserActivationLink(userId: ID!): ActivationLinkPayload!
  logout: Boolean!
  createSubTenant(
    name: String!
    slug: String!
    managementDomain: String
    websiteDomain: String
  ): Tenant!
  updateSubTenant(tenantId: ID!, input: UpdateSubTenantInput!): Tenant!
  startTenantDomainVerification(tenantId: ID!, purpose: TenantDomainPurpose!): TenantDomainVerification!
  checkTenantDomainVerification(tenantId: ID!, purpose: TenantDomainPurpose!): TenantDomainVerification!
  activateTenantDomain(tenantId: ID!, purpose: TenantDomainPurpose!, confirmHttpsAndRouting: Boolean!): TenantDomainVerification!
  setSubTenantStatus(tenantId: ID!, status: TenantStatus!): Tenant!
  createAdminUser(
    email: String!
    firstName: String!
    lastName: String!
    tenantId: ID
    role: SubTenantRole = ADMIN
  ): CreateTenantUserPayload!
  regenerateSubTenantUserActivationLink(tenantId: ID!, userId: ID!): TenantActivationLinkPayload!
  updateManagedSubTenantUser(tenantId: ID!, userId: ID!, input: UpdateTenantUserInput!): User!
  generateManagedSubTenantUserPasswordResetLink(tenantId: ID!, userId: ID!): PasswordResetLinkPayload!
  deleteManagedSubTenantUser(tenantId: ID!, userId: ID!): Boolean!
  updateTenantUser(id: ID!, input: UpdateTenantUserInput!): User!
  generateTenantUserActivationLink(userId: ID!): ActivationLinkPayload!
  generateTenantUserPasswordResetLink(userId: ID!): PasswordResetLinkPayload!
  deleteTenantUser(id: ID!): Boolean!
  createMainTenantUser(
    firstName: String!
    lastName: String!
    email: String!
  ): CreateMainTenantUserPayload!
  updateMainTenantUser(id: ID!, input: UpdateMainTenantUserInput!): User!
  deleteMainTenantUser(id: ID!): Boolean!
  createCategory(input: CreateCategoryInput!): Category!
  updateCategory(id: ID!, input: UpdateCategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!
  createSubcategory(input: CreateSubcategoryInput!): Subcategory!
  updateSubcategory(id: ID!, input: UpdateSubcategoryInput!): Subcategory!
  deleteSubcategory(id: ID!): Boolean!
  createTag(input: CreateTagInput!): Tag!
  updateTag(id: ID!, input: UpdateTagInput!): Tag!
  deleteTag(id: ID!): Boolean!
  createArticle(input: CreateArticleInput!): Article!
  updateArticle(id: ID!, input: UpdateArticleInput!): Article!
  deleteArticle(id: ID!): Boolean!
  deleteArchivedArticle(id: ID!): Boolean!
  submitArticleForReview(id: ID!): Article!
  requestArticleChanges(id: ID!, comment: String!): Article!
  publishArticle(id: ID!): Article!
  unpublishArticle(id: ID!): Article!
  scheduleArticle(id: ID!, scheduledAt: String!): Article!
  updateArticleSchedule(id: ID!, scheduledAt: String!): Article!
  cancelArticleSchedule(id: ID!): Article!
  archiveArticle(id: ID!): Article!
  restoreArticle(id: ID!): Article!
  setArticleBreaking(id: ID!, enabled: Boolean!): Article!
  setArticleFeatured(id: ID!, enabled: Boolean!): Article!
}
